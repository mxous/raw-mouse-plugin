[package]
name = "raw-mouse-plugin"
version = "0.1.0"
edition = "2021"

[features]
default = []
linux-evdev = []
linux-libinput = []
x11 = []
macos-cgevent = []
macos-iohid = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.18"
tauri = { version = "2", default-features = false, features = ["wry"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.48.0", features = ["Win32_Foundation", "Win32_UI_Input", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
libc = "0.2"

[package.metadata]
# metadata for local use
