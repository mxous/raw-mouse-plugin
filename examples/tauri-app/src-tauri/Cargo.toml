[package]
name = "raw-mouse-example"
version = "0.1.0"
edition = "2021"

[lib]
name = "raw_mouse_example_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
raw-mouse-plugin = { path = "../../..", features = ["windows"] }

[features]
default = []

